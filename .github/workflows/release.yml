name: Релиз сайта

# Выкладка запускается публикацией релиза на GitHub (или вручную со вкладки Actions).
# Экшн проверяет страницу, собирает сайт, прикладывает архив к релизу и выкладывает сайт на GitHub Pages.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Проверка и сборка
    runs-on: ubuntu-latest
    permissions:
      contents: write          # приложить архив к релизу
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Проверить страницу
        run: node tools/check.mjs

      - name: Собрать сайт
        run: |
          mkdir -p dist
          cp -R index.html assets dist/

      - name: Приложить архив к релизу
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd dist && zip -qr "../kinea-site-$TAG.zip" .)
          gh release upload "$TAG" "kinea-site-$TAG.zip" --clobber

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Выкладка на GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
